<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S2 · 白日蓝图 — 台式机爆炸拆解</title>
<style>
  :root{
    --paper:#f2f0e8;
    --ink:#14140f;
    --mute:#8a8578;
    --grid:#dcd7c9;
    --accent:#c4441a;
    --p:0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--paper);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 40px),
      repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 40px);
    opacity:.5;
    -webkit-mask-image:radial-gradient(ellipse at 62% 46%,#000 26%,transparent 76%);
            mask-image:radial-gradient(ellipse at 62% 46%,#000 26%,transparent 76%);
  }
  .scroll{height:300vh}
  .stage{position:sticky;top:0;height:100vh;overflow:hidden;z-index:1}

  .copy{position:absolute;left:5vw;top:50%;transform:translateY(-50%);max-width:24ch;z-index:3}
  .eyebrow{font:500 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.32em;
    text-transform:uppercase;color:var(--mute);margin-bottom:22px}
  .eyebrow b{color:var(--accent)}
  h1{font-size:clamp(34px,4.4vw,60px);line-height:1.04;letter-spacing:-.03em;font-weight:800}
  h1 span{color:var(--accent)}
  .lead{margin-top:20px;font-size:14px;line-height:1.95;color:#4a463c}
  .ticks{margin-top:26px;display:flex;flex-direction:column;gap:9px;
    font:500 11.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;color:var(--mute)}
  .ticks i{display:inline-block;width:22px;height:1px;background:var(--accent);
    vertical-align:middle;margin-right:10px;opacity:.7}

  .figure{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:flex-end}
  svg{width:min(74vw,1080px);height:auto;overflow:visible;transform:translateX(2vw)}

  .frame-dim{fill:none;stroke:#a8a294;stroke-width:1.2;stroke-dasharray:5 7}
  .ghost-dim{fill:none;stroke:#c3bdad;stroke-width:1.4}
  .plate{fill:var(--paper);stroke:#1c1c16;stroke-width:2.6;stroke-linejoin:round}
  .plate-ghost{fill:rgba(28,28,22,.04);stroke:#1c1c16;stroke-width:2}
  .line{fill:none;stroke:#1c1c16;stroke-width:1.5}
  .line-ghost{fill:none;stroke:#1c1c16;stroke-width:1;opacity:.45}
  .hot{fill:rgba(196,68,26,.10);stroke:var(--accent);stroke-width:2.2}
  .tag{font:500 12px/1 ui-monospace,Consolas,monospace;fill:#1c1c16;letter-spacing:.14em}
  .tag-s{font-size:10.5px;fill:var(--mute)}

  .hud{position:absolute;left:5vw;right:5vw;bottom:26px;z-index:4;
    display:flex;align-items:center;gap:14px;
    font:500 10.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.2em;color:var(--mute)}
  .bar{flex:1;height:1px;background:var(--grid);position:relative}
  .bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--accent);
    width:calc(var(--p) * 100%)}
  .hint{position:absolute;right:4vw;top:50%;transform:translateY(-50%) rotate(90deg);
    font:500 10px/1 ui-monospace,monospace;letter-spacing:.36em;color:var(--mute);z-index:4}
</style>
</head>
<body>
<div class="scroll">
<div class="stage">

  <div class="copy">
    <div class="eyebrow">SEC.01 &nbsp;/&nbsp; <b>拆解</b> TEARDOWN</div>
    <h1>把它<br>拆<span>开</span>看看</h1>
    <p class="lead">一台台式机里到底有什么。滚下去，一層一层自己散开。</p>
    <div class="ticks">
      <span><i></i>装机实战</span>
      <span><i></i>选购建议</span>
      <span><i></i>存储涨价的应对</span>
    </div>
  </div>

  <div class="figure">
    <svg id="sc" viewBox="0 0 1240 800" aria-label="台式机爆炸拆解示意图">
      <!-- 机箱骨架：不动，虚线 -->
      <path class="frame-dim" d="M380 120 L760 120 L760 700 L380 700 Z"/>
      <!-- 前置进风：不动 -->
      <g class="ghost-dim">
        <circle cx="742" cy="205" r="27"/>
        <circle cx="742" cy="278" r="27"/>
        <circle cx="742" cy="351" r="27"/>
      </g>

      <!-- 主板：向左 -->
      <g class="part" id="mobo" data-dx="-232">
        <rect class="plate-ghost" x="415" y="165" width="312" height="360" rx="4"/>
        <circle class="line-ghost" cx="443" cy="193" r="5" fill="none"/>
        <circle class="line-ghost" cx="699" cy="193" r="5" fill="none"/>
        <circle class="line-ghost" cx="443" cy="497" r="5" fill="none"/>
        <circle class="line-ghost" cx="699" cy="497" r="5" fill="none"/>
        <!-- 处理器插座 / 芯片组 / 扩展槽 -->
        <rect class="line-ghost" x="492" y="232" width="104" height="104" rx="3" fill="none"/>
        <rect class="line-ghost" x="592" y="392" width="64" height="48" rx="3" fill="none"/>
        <path class="line-ghost" d="M452 468 L676 468 M452 486 L676 486"/>
        <path class="line-ghost" d="M452 300 L470 300 M452 320 L470 320 M452 340 L470 340"/>
        <path class="line-ghost" d="M415 210 L742 210"/>
        <text class="tag" x="418" y="150">主板 <tspan class="tag-s">ATX</tspan></text>
      </g>

      <!-- 散热器 + CPU：左上 -->
      <g class="part" id="cooler" data-dx="-146" data-dy="-100">
        <rect class="hot" x="498" y="208" width="88" height="88" rx="3"/>
        <path class="line-ghost" d="M508 224 L578 224 M508 240 L578 240 M508 256 L578 256
          M508 272 L578 272 M508 288 L578 288"/>
        <text class="tag" x="500" y="196">散热器</text>
      </g>

      <!-- 内存 ×2：上 -->
      <g class="part" id="ram" data-dx="-58" data-dy="-126">
        <rect class="plate-ghost" x="644" y="214" width="16" height="150" rx="2"/>
        <rect class="plate-ghost" x="670" y="214" width="16" height="150" rx="2"/>
        <text class="tag" x="640" y="200">内存 <tspan class="tag-s">×2</tspan></text>
      </g>

      <!-- 显卡：左下 -->
      <g class="part" id="gpu" data-dx="-112" data-dy="126">
        <rect class="plate-ghost" x="430" y="548" width="272" height="66" rx="3"/>
        <circle class="line-ghost" cx="478" cy="581" r="20" fill="none"/>
        <circle class="line-ghost" cx="562" cy="581" r="20" fill="none"/>
        <circle class="line-ghost" cx="646" cy="581" r="20" fill="none"/>
        <text class="tag" x="432" y="640">显卡</text>
      </g>

      <!-- 电源：左下更远 -->
      <g class="part" id="psu" data-dx="-286" data-dy="58">
        <rect class="plate-ghost" x="404" y="622" width="150" height="76" rx="3"/>
        <circle class="line-ghost" cx="479" cy="660" r="22" fill="none"/>
        <text class="tag" x="406" y="612">电源 <tspan class="tag-s">750W</tspan></text>
      </g>

      <!-- 侧板：向右，不透明，最后才滑走 -->
      <g class="part" id="panel" data-dx="366">
        <rect class="plate" x="380" y="130" width="380" height="560" rx="10"/>
        <path class="line-ghost" d="M386 140 L754 140"/>
        <text class="tag" x="392" y="118">侧板 <tspan class="tag-s">钢化玻璃</tspan></text>
      </g>
    </svg>
  </div>

  <div class="hint">SCROLL</div>
  <div class="hud">
    <span id="pct">000%</span>
    <span class="bar"><i></i></span>
    <span>EXPLODED VIEW</span>
  </div>
</div>
</div>

<script>
(function(){
  const root = document.documentElement;
  const parts = [...document.querySelectorAll('.part')];
  const pct = document.getElementById('pct');
  const forced = new URLSearchParams(location.search).get('t');
  let target = 0, cur = 0;

  // 侧板比其他零件晚 22% 才滑开：先露内部，再整体散架
  const DELAY = { panel: 0.22 };

  function setP(p){
    root.style.setProperty('--p', p.toFixed(4));
    pct.textContent = String(Math.round(p*100)).padStart(3,'0') + '%';
    for (const el of parts){
      const d = DELAY[el.id] || 0;
      const q = Math.max(0, Math.min(1, (p - d) / (1 - d)));
      const e = q * q * (3 - 2 * q);           // smoothstep
      const dx = parseFloat(el.dataset.dx || 0) * e;
      const dy = parseFloat(el.dataset.dy || 0) * e;
      el.setAttribute('transform', 'translate(' + dx.toFixed(2) + ' ' + dy.toFixed(2) + ')');
    }
  }

  if (forced !== null){
    const t = Math.min(1, Math.max(0, parseFloat(forced) || 0));
    setP(t); return;
  }

  function measure(){
    const max = document.documentElement.scrollHeight - innerHeight;
    target = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  }
  addEventListener('scroll', measure, {passive:true});
  addEventListener('resize', measure);
  measure(); cur = target; setP(cur);

  (function tick(){
    cur += (target - cur) * 0.13;
    if (Math.abs(target - cur) > 1e-4) setP(cur);
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
