<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S1 · 暗场线框 — 台式机爆炸拆解</title>
<style>
  :root{--p:0}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#04050a;color:#e8eaf0;overflow-x:hidden;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  #gl{position:fixed;inset:0;z-index:1;display:block}
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at 55% 48%,transparent 34%,rgba(3,4,9,.88) 100%)}
  .scroll{height:300vh;position:relative;z-index:0}

  .copy{position:fixed;left:5vw;top:50%;transform:translateY(-50%);z-index:4;max-width:22ch;pointer-events:none}
  .eyebrow{font:500 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.34em;
    color:#5b6790;text-transform:uppercase;margin-bottom:20px}
  .eyebrow b{color:#7d9bff}
  h1{font-size:clamp(32px,4.2vw,56px);line-height:1.05;letter-spacing:-.03em;font-weight:800;
    background:linear-gradient(180deg,#fff 0%,#9fb4ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{margin-top:18px;font-size:13.5px;line-height:1.9;color:#98a2c2}

  .labels{position:fixed;inset:0;z-index:3;pointer-events:none}
  .lb{position:absolute;font:500 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.16em;
    color:#c9d4ff;white-space:nowrap;opacity:0;transform:translate(-50%,-50%);
    transition:opacity .25s;text-shadow:0 0 12px rgba(79,123,255,.6)}
  .lb i{display:block;width:1px;height:26px;margin:6px auto 0;
    background:linear-gradient(#4f7bff,rgba(79,123,255,0))}

  .hud{position:fixed;left:5vw;right:5vw;bottom:24px;z-index:5;display:flex;align-items:center;gap:14px;
    font:500 10.5px/1 ui-monospace,monospace;letter-spacing:.2em;color:#5b6790}
  .bar{flex:1;height:1px;background:#1b2136;position:relative}
  .bar i{position:absolute;left:0;top:-1px;height:3px;background:#4f7bff;width:calc(var(--p) * 100%);
    box-shadow:0 0 12px #4f7bff}
  .hint{position:fixed;right:4vw;top:50%;transform:translateY(-50%) rotate(90deg);z-index:5;
    font:500 10px/1 ui-monospace,monospace;letter-spacing:.36em;color:#3d4866}
  #err{position:fixed;left:5vw;top:24px;z-index:9;max-width:70ch;
    font:500 12px/1.7 ui-monospace,monospace;color:#ff8f6b;white-space:pre-wrap}
  #dbg{position:fixed;left:5vw;bottom:56px;z-index:9;
    font:500 11px/1.6 ui-monospace,monospace;color:#6f7da3;white-space:pre-wrap}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div class="labels" id="labels"></div>

<div class="scroll"></div>

<div class="copy">
  <div class="eyebrow">SEC.01 &nbsp;/&nbsp; <b>拆解</b></div>
  <h1>把它拆开看看</h1>
  <p class="lead">滚下去。线框会自己松开，一个零件一个零件往外走。</p>
</div>

<div class="hint">SCROLL</div>
<div class="hud">
  <span id="pct">000%</span><span class="bar"><i></i></span><span>S1 / DARK WIRE</span>
</div>
<div id="err"></div>
<div id="dbg"></div>

<script>
// ---- 星芒层（纯 2D，不依赖 WebGL）----
(function(){
  const cv = document.getElementById('stars');
  const ctx = cv.getContext('2d');
  const DPR = Math.min(devicePixelRatio || 1, 2);
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const rnd = mulberry32(20261024);
  let stars = [], sprite;
  function makeSprite(){
    const S = 96, H = S/2, c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d'); g.translate(H,H);
    const len = S*0.48, w = S*0.014;
    for (let i=0;i<4;i++){
      const gr = g.createLinearGradient(0,0,len,0);
      gr.addColorStop(0,'hsla(220,100%,100%,1)');
      gr.addColorStop(.12,'hsla(222,96%,88%,.85)');
      gr.addColorStop(.4,'hsla(226,96%,66%,.18)');
      gr.addColorStop(1,'hsla(230,96%,55%,0)');
      g.save(); g.rotate(i*Math.PI/4); g.fillStyle = gr;
      g.beginPath(); g.moveTo(0,-w);
      g.quadraticCurveTo(len*.3,-w*.7,len,0);
      g.quadraticCurveTo(len*.3,w*.7,0,w);
      g.closePath(); g.fill(); g.restore();
    }
    const r = S*0.05, core = g.createRadialGradient(0,0,0,0,0,r);
    core.addColorStop(0,'rgba(255,255,255,1)');
    core.addColorStop(.6,'rgba(226,240,255,.85)');
    core.addColorStop(1,'rgba(210,232,255,0)');
    g.fillStyle = core; g.beginPath(); g.arc(0,0,r,0,6.2832); g.fill();
    return c;
  }
  sprite = makeSprite();
  function rebuild(){
    cv.width = Math.floor(innerWidth*DPR);
    cv.height = Math.floor(innerHeight*DPR);
    const N = Math.max(140, Math.round(innerWidth*innerHeight/9000));
    stars = [];
    for (let i=0;i<N;i++){
      stars.push({x:rnd(),y:rnd(),s:.35+rnd()*1.1,a:.25+rnd()*.6,ph:rnd()*6.283,sp:.5+rnd()*1.4});
    }
  }
  rebuild();
  addEventListener('resize', rebuild);
  window.__drawStars = function(progress, t){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars){
      const par = 1 + progress*1.4;                 // 越往下越"贴脸"
      const x = ((s.x + (progress-0.5)*0.12*s.s) % 1) * cv.width;
      const y = s.y * cv.height;
      const size = 22*s.s*par;
      const tw = .55 + .45*Math.sin(t*s.sp + s.ph);
      ctx.globalAlpha = s.a * tw * (1 - progress*0.35);
      ctx.drawImage(sprite, x - size/2, y - size/2, size, size);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  };
})();
</script>

<script type="module">
const errBox = document.getElementById('err');
function fail(msg){ errBox.textContent = 'WEBGL/THREE 失败：' + msg; }
let THREE;
try { THREE = await import('three'); } catch(e){ fail('import three: ' + e.message); throw e; }

const canvas = document.getElementById('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
} catch(e){
  fail('WebGLRenderer: ' + e.message);
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 2000);

// ---------- 机箱零件（单位约等于 cm）----------
const LINE = new THREE.LineBasicMaterial({ color:0x5b86ff, transparent:true, opacity:.95 });
const LINE_HOT = new THREE.LineBasicMaterial({ color:0xff6b3d, transparent:true, opacity:.95 });
const parts = [];

function box(name, w, h, d, pos, expl, hot){
  const geo = new THREE.BoxGeometry(w, h, d);
  const edges = new THREE.EdgesGeometry(geo);
  const line = new THREE.LineSegments(edges, hot ? LINE_HOT : LINE);
  line.position.set(pos[0], pos[1], pos[2]);
  scene.add(line);
  parts.push({
    name, obj: line,
    base: new THREE.Vector3(pos[0], pos[1], pos[2]),
    expl: new THREE.Vector3(expl[0], expl[1], expl[2])
  });
  return line;
}

// 尺寸：机箱 w20 h46 d42，原点在中心
box('机箱框架', 20, 46, 42, [0, 0, 0], [0, 0, 0], false);
box('侧板', 0.6, 44, 40, [10, 0, 0], [15, 0, 0], false);
box('主板', 0.5, 34, 30, [-9.2, 1, 0], [-13, 0, 0], false);
box('散热器', 11, 15, 11, [-5.2, 8, -2], [-9, 7, 0], true);
box('内存', 0.8, 13, 1.4, [-8.6, 5, 2.4], [-9, 5, 3], false);
box('显卡', 26, 4.5, 11, [-2, 0.5, -5], [0, 0, 16], true);
box('电源', 15, 8.5, 16, [0, -17.5, 2], [-4, -13, 3], false);

// 前置风扇（三个环）
const fanMat = new THREE.LineBasicMaterial({ color:0x7d9bff, transparent:true, opacity:.55 });
for (let i=0;i<3;i++){
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(4.4, 0.16, 6, 40),
    new THREE.MeshBasicMaterial({ color:0x7d9bff, transparent:true, opacity:.5, wireframe:true })
  );
  ring.position.set(8.6, 9 - i*9.6, 0);
  ring.rotation.y = Math.PI/2;
  scene.add(ring);
  parts.push({ name:'进风', obj:ring, base:ring.position.clone(), expl:new THREE.Vector3(14, 0, 0) });
}

// ---------- 标签 DOM ----------
const labelsEl = document.getElementById('labels');
const LABELS = ['侧板','主板','散热器','显卡','电源'];
const labelMap = new Map();
for (const n of LABELS){
  const d = document.createElement('div');
  d.className = 'lb'; d.innerHTML = n + '<i></i>';
  labelsEl.appendChild(d);
  labelMap.set(n, d);
}

// ---------- 滚动进度 ----------
const forced = new URLSearchParams(location.search).get('t');
const FORCED = forced === null ? null : Math.min(1, Math.max(0, parseFloat(forced) || 0));
let target = 0, cur = 0;

function measure(){
  const max = document.documentElement.scrollHeight - innerHeight;
  target = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
}

const pctEl = document.getElementById('pct');
const v3 = new THREE.Vector3();
const shellAlpha = { v: 1 };

function place(p){
  for (const it of parts){
    it.obj.position.copy(it.base).addScaledVector(it.expl, p);
    if (it.name === '机箱框架'){
      it.obj.material.opacity = 0.95 * (1 - p*0.82);
    }
  }
  // 相机后撤
  camera.position.set(52 + p*16, 26 + p*7, 66 + p*26);
  camera.lookAt(0, 0, 0);
  camera.updateMatrixWorld();

  // 标签投影
  for (const [name, el] of labelMap){
    const it = parts.find(x => x.name === name);
    if (!it) continue;
    v3.copy(it.obj.position).project(camera);
    const x = (v3.x*0.5+0.5)*innerWidth;
    const y = (0.5 - v3.y*0.5)*innerHeight;
    el.style.left = x + 'px';
    el.style.top = (y - 30) + 'px';
    el.style.opacity = String(Math.max(0, Math.min(1, (p - 0.18) / 0.45)) * 0.95);
  }
}

const DBG = new URLSearchParams(location.search).get('dbg') !== null;
const dbgEl = document.getElementById('dbg');
function report(){
  if (!DBG) return;
  const sc = document.getElementById('stars');
  dbgEl.textContent = [
    'calls=' + renderer.info.render.calls,
    'lines=' + renderer.info.render.lines,
    'gl=' + canvas.width + 'x' + canvas.height,
    'css=' + canvas.clientWidth + 'x' + canvas.clientHeight,
    'stars=' + (typeof window.__drawStars),
    'starsCv=' + sc.width + 'x' + sc.height,
    'parts=' + parts.length,
    'ctx=' + (renderer.getContext() ? 'ok' : 'null')
  ].join('\n');
}

function draw(t){
  place(FORCED !== null ? FORCED : cur);
  const p = FORCED !== null ? FORCED : cur;
  const hue = 0.60 + p*0.14;
  LINE.color.setHSL(hue, 0.82, 0.66);
  LINE_HOT.color.setHSL(0.055, 0.9, 0.6);
  renderer.render(scene, camera);
  if (window.__drawStars) window.__drawStars(p, t);
  pctEl.textContent = String(Math.round(p*100)).padStart(3,'0') + '%';
  document.documentElement.style.setProperty('--p', p.toFixed(4));
  report();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

if (FORCED !== null){
  // 锁定进度仍持续渲染：无头截图必须保证合成器能拿到画布内容
  (function spin(){
    draw(2.0);
    requestAnimationFrame(spin);
  })();
} else {
  measure(); cur = target;
  addEventListener('scroll', measure, {passive:true});
  const clock = new THREE.Clock();
  (function loop(){
    cur += (target - cur) * 0.1;
    draw(clock.getElapsedTime());
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
