<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S1b · 暗场线框 — 台式机爆炸拆解（缓动版）</title>
<style>
  :root{--p:0}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#04050a;color:#e8eaf0;overflow-x:hidden;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  #glow{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse 52% 46% at 56% 50%, rgba(38,62,140,.30), transparent 72%)}
  #gl{position:fixed;inset:0;z-index:1;display:block}
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at 56% 50%,transparent 38%,rgba(3,4,9,.92) 100%)}
  .scroll{height:340vh;position:relative;z-index:0}

  .copy{position:fixed;left:5vw;top:50%;transform:translateY(-50%);z-index:4;max-width:21ch;pointer-events:none}
  .eyebrow{font:500 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.34em;
    color:#5b6790;text-transform:uppercase;margin-bottom:20px}
  .eyebrow b{color:#7d9bff}
  h1{font-size:clamp(30px,3.9vw,52px);line-height:1.06;letter-spacing:-.03em;font-weight:800;
    background:linear-gradient(180deg,#fff 0%,#9fb4ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{margin-top:18px;font-size:13px;line-height:1.95;color:#8b96b8}

  .labels{position:fixed;inset:0;z-index:3;pointer-events:none}
  .lb{position:absolute;opacity:0;transform:translate(-50%,0);transition:opacity .3s;
    font:500 10.5px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.2em;color:#cdd8ff;
    white-space:nowrap;text-shadow:0 0 14px rgba(79,123,255,.55)}
  .lb s{display:block;text-decoration:none;font-size:9px;letter-spacing:.12em;
    color:#6a76a0;margin-top:5px;text-align:center}
  .lb b{display:block;width:1px;height:22px;margin:7px auto 0;
    background:linear-gradient(rgba(125,155,255,.85),rgba(125,155,255,0))}

  .hud{position:fixed;left:5vw;right:5vw;bottom:24px;z-index:5;display:flex;align-items:center;gap:14px;
    font:500 10.5px/1 ui-monospace,monospace;letter-spacing:.2em;color:#5b6790}
  .bar{flex:1;height:1px;background:#1b2136;position:relative}
  .bar i{position:absolute;left:0;top:-1px;height:3px;background:#4f7bff;width:calc(var(--p) * 100%);
    box-shadow:0 0 14px #4f7bff}
  .hint{position:fixed;right:4vw;top:50%;transform:translateY(-50%) rotate(90deg);z-index:5;
    font:500 10px/1 ui-monospace,monospace;letter-spacing:.36em;color:#3d4866}
  #err{position:fixed;left:5vw;top:20px;z-index:9;max-width:70ch;
    font:500 12px/1.7 ui-monospace,monospace;color:#ff8f6b;white-space:pre-wrap}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="stars"></canvas>
<div id="glow"></div>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div class="labels" id="labels"></div>
<div class="scroll"></div>

<div class="copy">
  <div class="eyebrow">SEC.01 &nbsp;/&nbsp; <b>拆解</b></div>
  <h1>把它拆开看看</h1>
  <p class="lead">滚下去。线框会自己松开，一个零件一个零件往外走。</p>
</div>
<div class="hint">SCROLL</div>
<div class="hud">
  <span id="pct">000%</span><span class="bar"><i></i></span><span>S1b / DARK WIRE</span>
</div>
<div id="err"></div>

<script>
// ---------- 星芒层：只做柔光点，不做卡通星芒 ----------
(function(){
  const cv = document.getElementById('stars');
  const ctx = cv.getContext('2d');
  const DPR = Math.min(devicePixelRatio || 1, 2);
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const rnd = mulberry32(1124);
  let stars = [], sprite;

  function makeSprite(){
    const S = 64, H = S/2, c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(H,H,0,H,H,H);
    rg.addColorStop(0,   'rgba(255,255,255,1)');
    rg.addColorStop(0.18,'rgba(226,236,255,.62)');
    rg.addColorStop(0.45,'rgba(160,190,255,.16)');
    rg.addColorStop(1,   'rgba(120,160,255,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(H,H,H,0,6.2832); g.fill();
    return c;
  }
  sprite = makeSprite();

  function rebuild(){
    cv.width = Math.floor(innerWidth*DPR);
    cv.height = Math.floor(innerHeight*DPR);
    const N = Math.max(60, Math.round(innerWidth*innerHeight/26000));
    stars = [];
    for (let i=0;i<N;i++){
      stars.push({x:rnd(), y:rnd(), s:.5+rnd()*1.6, a:.12+rnd()*.34, ph:rnd()*6.283, sp:.3+rnd()*.9});
    }
  }
  rebuild();
  addEventListener('resize', rebuild);

  window.__drawStars = function(progress, t){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars){
      const x = s.x * cv.width;
      const y = s.y * cv.height;
      const size = 26 * s.s * (1 + progress*1.1);
      const tw = .6 + .4*Math.sin(t*s.sp*.6 + s.ph);
      ctx.globalAlpha = s.a * tw * (1 - progress*0.4);
      ctx.drawImage(sprite, x - size/2, y - size/2, size, size);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  };
})();
</script>

<script type="module">
const errBox = document.getElementById('err');
let THREE;
try { THREE = await import('three'); }
catch(e){ errBox.textContent = 'import three 失败: ' + e.message; throw e; }

const canvas = document.getElementById('gl');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true }); }
catch(e){ errBox.textContent = 'WebGLRenderer 失败: ' + e.message; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const FOV = 40;
const camera = new THREE.PerspectiveCamera(FOV, innerWidth/innerHeight, 0.5, 4000);

// ---------- 线条材质分级：骨架最淡，主体中等，强调色 ----------
const MAT = {
  shell: new THREE.LineBasicMaterial({ color:0x3a4a72, transparent:true, opacity:.5 }),
  main:  new THREE.LineBasicMaterial({ color:0x5b86ff, transparent:true, opacity:.92 }),
  soft:  new THREE.LineBasicMaterial({ color:0x6f8fd0, transparent:true, opacity:.55 }),
  hot:   new THREE.LineBasicMaterial({ color:0xff7a45, transparent:true, opacity:.95 })
};

const parts = [];

function addEdges(name, geo, mat, pos, expl, tag){
  const line = new THREE.LineSegments(new THREE.EdgesGeometry(geo), mat);
  line.position.set(pos[0], pos[1], pos[2]);
  scene.add(line);
  parts.push({
    name, obj: line, tag: tag || '',
    base: new THREE.Vector3(pos[0], pos[1], pos[2]),
    expl: new THREE.Vector3(expl[0], expl[1], expl[2])
  });
  return line;
}

// 机箱：w20 h46 d42
addEdges('机箱骨架', new THREE.BoxGeometry(20, 46, 42), MAT.shell, [0,0,0], [0,0,0], '');

// 侧板（玻璃）：最外，走最远
addEdges('侧板', new THREE.BoxGeometry(0.6, 44, 40), MAT.main, [10,0,0], [30,0,0], '钢化玻璃');

// 主板
addEdges('主板', new THREE.BoxGeometry(0.6, 34, 30), MAT.main, [-9.4,1,0], [-26,0,0], 'ATX / B760');

// 塔式散热
addEdges('散热器', new THREE.BoxGeometry(11.5, 16, 11.5), MAT.hot, [-4.6,8,-2], [-20,14,0], '双塔六热管');

// CPU
addEdges('处理器', new THREE.BoxGeometry(4.6,0.6,4.6), MAT.soft, [-8.6,2.4,-2], [-14,8,2], 'i5 / 6P+8E');

// 内存 ×2
addEdges('内存 A', new THREE.BoxGeometry(1.0,13,1.6), MAT.main, [-8.4,5,2.2], [-16,10,4], '16G 双通道');
addEdges('内存 B', new THREE.BoxGeometry(1.0,13,1.6), MAT.main, [-8.4,5,4.6], [-16,12,7], '');

// 显卡
addEdges('显卡', new THREE.BoxGeometry(27,4.8,11), MAT.hot, [-2,0.6,-5], [0,-2,30], '三风扇 / 2.5 槽');

// 电源
addEdges('电源', new THREE.BoxGeometry(15,8.6,16), MAT.main, [0,-17.6,2], [-6,-24,4], '750W 金牌');

// M.2 固态
addEdges('固态', new THREE.BoxGeometry(8,0.5,2.2), MAT.soft, [-7.6,3.2,-9], [-16,-9,-6], '1TB Gen4');

// 顶盖
addEdges('顶盖', new THREE.BoxGeometry(19,0.6,40), MAT.soft, [0,23,0], [0,26,0], '');

// 前置风扇 ×3（环）
for (let i=0;i<3;i++){
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(4.6, 0.14, 6, 48),
    new THREE.MeshBasicMaterial({ color:0x7d9bff, transparent:true, opacity:.65 })
  );
  ring.position.set(8.4, 9 - i*9.6, 0);
  ring.rotation.y = Math.PI/2;
  scene.add(ring);
  parts.push({ name:'进风 '+(i+1), obj:ring, tag:'140mm',
    base:ring.position.clone(), expl:new THREE.Vector3(26, 0, 0) });
}

// ---------- 标签（跟着零件走，按区域错开，避免互相压）------------
const labelsEl = document.getElementById('labels');
const LABEL_OFFSET = {
  '侧板':[0,-34], '主板':[-58,0], '散热器':[0,-30], '显卡':[0,26],
  '电源':[0,26], '内存 A':[46,-14], '处理器':[-52,10], '固态':[-46,0]
};
const labelEls = new Map();
for (const it of parts){
  if (!LABEL_OFFSET[it.name]) continue;
  const d = document.createElement('div');
  d.className = 'lb';
  d.innerHTML = it.name + (it.tag ? '<s>' + it.tag + '</s>' : '') + '<b></b>';
  labelsEl.appendChild(d);
  labelEls.set(it.name, d);
}

// ---------- 三次方缓入缓出 ----------
const easeInOutCubic = p => p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;

// ---------- 进度 ----------
const forced = new URLSearchParams(location.search).get('t');
const FORCED = forced === null ? null : Math.min(1, Math.max(0, parseFloat(forced) || 0));
let target = 0, cur = 0;
function measure(){
  const max = document.documentElement.scrollHeight - innerHeight;
  target = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
}

const pctEl = document.getElementById('pct');
const v3 = new THREE.Vector3();

// 自动取景：按散开半径算相机距离，保证怎么拉都框得住
function frame(e){
  const radius = 30 + e * 30;
  const dist = radius / Math.tan(THREE.MathUtils.degToRad(FOV/2)) * 1.12;
  const ang = -0.30 + e * 0.24;                 // 轻微绕行，增加纵深
  camera.position.set(Math.sin(ang)*dist*0.92, dist*0.20 - e*3, Math.cos(ang)*dist);
  camera.lookAt(0, -e*3.5, 0);
  camera.updateMatrixWorld();
}

function place(e){
  for (const it of parts){
    it.obj.position.copy(it.base).addScaledVector(it.expl, e);
    if (it.name === '机箱骨架') it.obj.material.opacity = 0.5 * (1 - e*0.75);
  }
  frame(e);

  for (const [name, el] of labelEls){
    const it = parts.find(x => x.name === name);
    if (!it) continue;
    v3.copy(it.obj.position).project(camera);
    const off = LABEL_OFFSET[name];
    el.style.left = ((v3.x*0.5+0.5)*innerWidth + off[0]) + 'px';
    el.style.top  = ((0.5 - v3.y*0.5)*innerHeight + off[1]) + 'px';
    el.style.opacity = String(Math.max(0, Math.min(1, (e - 0.34) / 0.36)) * 0.92);
  }
}

function draw(t){
  const raw = FORCED !== null ? FORCED : cur;
  const e = easeInOutCubic(raw);
  place(e);
  MAT.main.color.setHSL(0.615 + e*0.045, 0.86, 0.68);
  renderer.render(scene, camera);
  if (window.__drawStars) window.__drawStars(e, t);
  pctEl.textContent = String(Math.round(raw*100)).padStart(3,'0') + '%';
  document.documentElement.style.setProperty('--p', raw.toFixed(4));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

measure(); cur = target;
addEventListener('scroll', measure, {passive:true});

// 持续渲染：无头截帧必须保证合成器拿到最新一帧
(function loop(){
  const clock = performance.now()/1000;
  if (FORCED === null){
    cur += (target - cur) * 0.12;
    if (Math.abs(target - cur) < 1e-4) cur = target;
  }
  draw(clock);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
