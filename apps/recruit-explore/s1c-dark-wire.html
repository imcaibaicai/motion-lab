<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S1c · 暗场线框 — 台式机爆炸拆解（包围盒取景）</title>
<style>
  :root{--p:0}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#04050a;color:#e8eaf0;overflow-x:hidden;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  #glow{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse 50% 44% at 60% 50%, rgba(40,66,148,.28), transparent 72%)}
  #gl{position:fixed;inset:0;z-index:1;display:block}
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at 58% 50%,transparent 40%,rgba(3,4,9,.9) 100%)}
  .scroll{height:340vh;position:relative;z-index:0}

  .copy{position:fixed;left:5vw;top:33%;z-index:4;max-width:17ch;pointer-events:none}
  .eyebrow{font:500 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.34em;
    color:#5b6790;text-transform:uppercase;margin-bottom:20px}
  .eyebrow b{color:#7d9bff}
  h1{font-size:clamp(30px,3.9vw,52px);line-height:1.06;letter-spacing:-.03em;font-weight:800;
    background:linear-gradient(180deg,#fff 0%,#9fb4ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{margin-top:18px;font-size:13px;line-height:1.95;color:#8b96b8}

  .labels{position:fixed;inset:0;z-index:3;pointer-events:none}
  .lb{position:absolute;opacity:0;transform:translate(-50%,0);transition:opacity .3s;
    font:600 11.5px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.18em;color:#dbe4ff;
    white-space:nowrap;text-shadow:0 0 16px rgba(60,100,255,.5),0 1px 2px rgba(0,0,0,.9)}
  .lb s{display:block;text-decoration:none;font-size:11px;letter-spacing:0;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#93a2c6;margin-top:6px;text-align:center;text-shadow:0 1px 2px #000}
  .lb b{display:block;width:1px;height:20px;margin:7px auto 0;
    background:linear-gradient(rgba(125,155,255,.9),rgba(125,155,255,0))}

  .hud{position:fixed;left:5vw;right:5vw;bottom:24px;z-index:5;display:flex;align-items:center;gap:14px;
    font:500 10.5px/1 ui-monospace,monospace;letter-spacing:.2em;color:#5b6790}
  .bar{flex:1;height:1px;background:#1b2136;position:relative}
  .bar i{position:absolute;left:0;top:-1px;height:3px;background:#4f7bff;width:calc(var(--p) * 100%);
    box-shadow:0 0 14px #4f7bff}
  .hint{position:fixed;right:4vw;top:50%;transform:translateY(-50%) rotate(90deg);z-index:5;
    font:500 10px/1 ui-monospace,monospace;letter-spacing:.36em;color:#3d4866}
  #err{position:fixed;left:5vw;top:20px;z-index:9;max-width:70ch;
    font:500 12px/1.7 ui-monospace,monospace;color:#ff8f6b;white-space:pre-wrap}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="stars"></canvas>
<div id="glow"></div>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div class="labels" id="labels"></div>
<div class="scroll"></div>

<div class="copy">
  <div class="eyebrow">SEC.01 &nbsp;/&nbsp; <b>拆解</b></div>
  <h1>把它拆开看看</h1>
  <p class="lead">滚下去。线框会自己松开，一个零件一个零件往外走。</p>
</div>
<div class="hint">SCROLL</div>
<div class="hud">
  <span id="pct">000%</span><span class="bar"><i></i></span><span>S1c / DARK WIRE</span>
</div>
<div id="err"></div>

<script>
// ---------- 星芒层：柔光点，不做卡通星芒 ----------
(function(){
  const cv = document.getElementById('stars');
  const ctx = cv.getContext('2d');
  const DPR = Math.min(devicePixelRatio || 1, 2);
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const rnd = mulberry32(1124);
  let stars = [], sprite;

  function makeSprite(){
    const S = 64, H = S/2, c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(H,H,0,H,H,H);
    rg.addColorStop(0,   'rgba(255,255,255,1)');
    rg.addColorStop(0.16,'rgba(228,238,255,.60)');
    rg.addColorStop(0.42,'rgba(160,190,255,.15)');
    rg.addColorStop(1,   'rgba(120,160,255,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(H,H,H,0,6.2832); g.fill();
    return c;
  }
  sprite = makeSprite();

  function rebuild(){
    cv.width = Math.floor(innerWidth*DPR);
    cv.height = Math.floor(innerHeight*DPR);
    const N = Math.max(50, Math.round(innerWidth*innerHeight/32000));
    stars = [];
    for (let i=0;i<N;i++){
      stars.push({x:rnd(), y:rnd(), s:.5+rnd()*1.5, a:.10+rnd()*.30, ph:rnd()*6.283, sp:.3+rnd()*.8});
    }
  }
  rebuild();
  addEventListener('resize', rebuild);

  window.__drawStars = function(progress, t){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars){
      const x = s.x * cv.width;
      const y = s.y * cv.height;
      const size = 24 * s.s * (1 + progress*1.0);
      const tw = .65 + .35*Math.sin(t*s.sp*.5 + s.ph);
      ctx.globalAlpha = s.a * tw * (1 - progress*0.45);
      ctx.drawImage(sprite, x - size/2, y - size/2, size, size);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  };
})();
</script>

<script type="module">
const errBox = document.getElementById('err');
let THREE;
try { THREE = await import('three'); }
catch(e){ errBox.textContent = 'import three 失败: ' + e.message; throw e; }

const canvas = document.getElementById('gl');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true }); }
catch(e){ errBox.textContent = 'WebGLRenderer 失败: ' + e.message; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04050a, 0.0026);   // 景深：远处零件自然退到暗部
const root = new THREE.Group();
root.position.x = 7;            // 整机右移，给左侧文案让位
scene.add(root);

const FOV = 40;
const camera = new THREE.PerspectiveCamera(FOV, innerWidth/innerHeight, 0.5, 5000);

const MAT = {
  shell: new THREE.LineBasicMaterial({ color:0x41527d, transparent:true, opacity:.55 }),
  main:  new THREE.LineBasicMaterial({ color:0x5b86ff, transparent:true, opacity:.94 }),
  soft:  new THREE.LineBasicMaterial({ color:0x7391cc, transparent:true, opacity:.6 }),
  hot:   new THREE.LineBasicMaterial({ color:0xff7a45, transparent:true, opacity:.95 })
};

const parts = [];

function addEdges(name, geo, mat, pos, expl, tag){
  const line = new THREE.LineSegments(new THREE.EdgesGeometry(geo), mat);
  line.position.set(pos[0], pos[1], pos[2]);
  root.add(line);
  parts.push({
    name, obj: line, tag: tag || '',
    base: new THREE.Vector3(pos[0], pos[1], pos[2]),
    expl: new THREE.Vector3(expl[0], expl[1], expl[2])
  });
  return line;
}

// 机箱 w20 h46 d42
addEdges('机箱骨架', new THREE.BoxGeometry(20, 46, 42), MAT.shell, [0,0,0], [0,0,0], '');
addEdges('侧板', new THREE.BoxGeometry(0.6, 44, 40), MAT.main, [10,0,0], [28,0,0], '钢化玻璃');
addEdges('主板', new THREE.BoxGeometry(0.6, 34, 30), MAT.main, [-9.4,1,0], [-26,0,0], 'ATX / B760');
addEdges('散热器', new THREE.BoxGeometry(11.5, 16, 11.5), MAT.hot, [-4.6,8,-2], [-20,13,0], '双塔六热管');
addEdges('处理器', new THREE.BoxGeometry(4.6,0.6,4.6), MAT.soft, [-8.6,2.4,-2], [-15,8,3], 'i5 / 14 核');
addEdges('内存 A', new THREE.BoxGeometry(1.0,13,1.6), MAT.main, [-8.4,5,2.2], [-17,11,4], 'DDR5 双通道');
addEdges('内存 B', new THREE.BoxGeometry(1.0,13,1.6), MAT.main, [-8.4,5,4.6], [-17,13,8], '');
addEdges('显卡', new THREE.BoxGeometry(27,4.8,11), MAT.main, [-2,0.6,-5], [0,-3,28], '三风扇 2.5 槽');
addEdges('电源', new THREE.BoxGeometry(15,8.6,16), MAT.main, [0,-17.6,2], [-7,-20,5], '750W 金牌');
addEdges('固态', new THREE.BoxGeometry(8,0.5,2.2), MAT.soft, [-7.6,3.2,-9], [-16,-9,-8], '1TB Gen4');
addEdges('顶盖', new THREE.BoxGeometry(19,0.6,40), MAT.soft, [0,23,0], [0,22,0], '');

for (let i=0;i<3;i++){
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(4.6, 0.14, 6, 48),
    new THREE.MeshBasicMaterial({ color:0x7d9bff, transparent:true, opacity:.6 })
  );
  ring.position.set(8.4, 9 - i*9.6, 0);
  ring.rotation.y = Math.PI/2;
  root.add(ring);
  parts.push({ name:'进风 '+(i+1), obj:ring, tag:'140mm',
    base:ring.position.clone(), expl:new THREE.Vector3(24, 0, 0) });
}

// ---------- 标签：跟随零件，按区域错开 ----------
const labelsEl = document.getElementById('labels');
const LABEL_OFFSET = {
  '侧板':[10,-30], '主板':[-74,4], '散热器':[-16,-34], '显卡':[0,30], '电源':[0,28]
};
// 体积大的零件，标注要往外多推一点，否则会落在本体的投影上
const LABEL_PUSH = { '显卡': 78, '主板': 46, '侧板': 34 };
const labelEls = new Map();
for (const it of parts){
  if (!LABEL_OFFSET[it.name]) continue;
  const d = document.createElement('div');
  d.className = 'lb';
  d.innerHTML = it.name + (it.tag ? '<s>' + it.tag + '</s>' : '') + '<b></b>';
  labelsEl.appendChild(d);
  labelEls.set(it.name, d);
}

// ---------- 三次方缓入缓出 ----------
const easeInOutCubic = p => p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;

// ---------- 进度 ----------
const forced = new URLSearchParams(location.search).get('t');
const FORCED = forced === null ? null : Math.min(1, Math.max(0, parseFloat(forced) || 0));
let target = 0, cur = 0;
function measure(){
  const max = document.documentElement.scrollHeight - innerHeight;
  target = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
}

const pctEl = document.getElementById('pct');
const v3 = new THREE.Vector3();
const wp = new THREE.Vector3();
const box = new THREE.Box3();
const center = new THREE.Vector3();
const size = new THREE.Vector3();

// 按实际包围盒取景：怎么拉都不会出画
function frame(e){
  box.makeEmpty();
  for (const it of parts) if (it.name !== '机箱骨架') box.expandByObject(it.obj);

  if (box.isEmpty()){
    camera.position.set(0, 8, 90);
    camera.lookAt(0, 0, 0);
    camera.updateMatrixWorld();
    return;
  }
  box.getCenter(center);
  box.getSize(size);

  const fitH = size.y;
  const fitW = size.x / camera.aspect;
  const need = Math.max(fitH, fitW) / 2;
  const dist = need / Math.tan(THREE.MathUtils.degToRad(FOV/2)) * 1.34;

  const ang = -0.26 + e * 0.20;
  camera.position.set(
    center.x + Math.sin(ang) * dist * 0.9,
    center.y + dist * 0.17,
    center.z + Math.cos(ang) * dist
  );
  camera.lookAt(center);
  camera.updateMatrixWorld();
}

function place(e){
  for (const it of parts){
    it.obj.position.copy(it.base).addScaledVector(it.expl, e);
    if (it.name === '机箱骨架') it.obj.material.opacity = 0.62 * (1 - e*0.45);
  }
  frame(e);

  // 标注：先算理想位置，再做同侧纵向去冲突（保底间距 56px），越界回推
  const items = [];
  for (const [name, el] of labelEls){
    const it = parts.find(x => x.name === name);
    if (!it) continue;
    it.obj.getWorldPosition(wp);
    v3.copy(wp).project(camera);
    const sx = (v3.x*0.5+0.5)*innerWidth;
    const sy = (0.5 - v3.y*0.5)*innerHeight;
    const side = sx < innerWidth*0.55 ? -1 : 1;
    const push = 116 + (LABEL_PUSH[name] || 0);
    items.push({ el, side, x: sx + side*push, y: sy - 30 });
  }

  const MIN_GAP = 56;
  for (const s of [-1, 1]){
    const arr = items.filter(o => o.side === s).sort((a, b) => a.y - b.y);
    let prev = -Infinity;
    for (const o of arr){
      o.y = Math.max(o.y, prev + MIN_GAP);
      prev = o.y;
    }
    const overflow = prev - (innerHeight - 84);
    if (overflow > 0) for (const o of arr) o.y -= overflow;
  }

  const alpha = Math.max(0, Math.min(1, (e - 0.30) / 0.34)) * 0.95;
  for (const o of items){
    o.el.style.left = o.x + 'px';
    o.el.style.top = o.y + 'px';
    o.el.style.opacity = String(alpha);
  }
}

function draw(t){
  const raw = FORCED !== null ? FORCED : cur;
  const e = easeInOutCubic(raw);
  place(e);
  MAT.main.color.setHSL(0.615 + e*0.04, 0.86, 0.68);
  renderer.render(scene, camera);
  if (window.__drawStars) window.__drawStars(e, t);
  pctEl.textContent = String(Math.round(raw*100)).padStart(3,'0') + '%';
  document.documentElement.style.setProperty('--p', raw.toFixed(4));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

measure(); cur = target;
addEventListener('scroll', measure, {passive:true});

(function loop(){
  const clock = performance.now()/1000;
  if (FORCED === null){
    cur += (target - cur) * 0.12;
    if (Math.abs(target - cur) < 1e-4) cur = target;
  }
  draw(clock);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
